<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/produto.css}">
</head>
<body>
    <h1>Lista de Produtos</h1>
    <div class="tabela">

    <div class="produto" th:each="produto : ${produtos}">

        <img th:src="@{'/' + ${produto.image}}" alt="Imagem">

        <h3>[[${produto.nome}]]</h3>

        <p>[[${produto.descricao}]]</p>

        <p class="preco">R$ [[${produto.preco}]]</p>

        <a class="compra" th:href="@{/produto/{id}(id=${produto.id})}">Ver detalhes</a>
    </div>
</div>
</body>
</html>
