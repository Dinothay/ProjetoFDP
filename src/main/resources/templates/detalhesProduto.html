<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" th:href="@{/css/tela.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/detalhes.css}">
</head>
<body>
    <div class="top">
        <div class="it">
            <a th:href="@{/listaProduto}"><img th:src="@{/images/logologo.png}" alt="Logo"></a>
        </div>
        <div class="it">
            <form th:action="@{/listaProduto}" method="GET">
                <input class="bs" placeholder="O que você precisa?" type="search" name="busca">
                <button type="submit">Buscar</button>
            </form>
        </div>
        <div class="it">
            <form th:action="@{/listaProduto}" method="GET">
                <button type="submit">Limpar Busca</button>
            </form>
        </div>
    </div>
    <div class="produtos">
        <div class="detalhes">
            <div class="imag">
                <div><img th:src="@{'/' + ${produto.image}}" alt="Imagem"></div>
            </div>
            <div class="txt">
                <ul>
                    <li class="titulo">[[${produto.nome}]]</li>
                    <li class="valor">R$ [[${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}]]</li>
                    <li class="descricao">Descrição: [[${produto.descricao}]]</li>
                    <li>
                        <form th:action="@{/comprarProduto}" method="POST">
                            <input type="hidden" name="id" th:value="${produto.id}">
                            <button class="botao" type="submit">Comprar</button>
                        </form>
                    </li>
                    <li>
                        <form th:action="@{/adicionar}" method="POST">
                            <input type="hidden" name="id" th:value="${produto.id}">
                            <button class="botao" type="submit">Adicionar ao carrinho</button>
                        </form>
                    </li>
                    <li>
                        <form th:if="${usuario != null and usuario.gerente}"
                            th:action="@{/produto/{id}/deletar(id=${produto.id})}" method="POST">
                            <button class="botao" type="submit">Excluir produto</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="fbnt">
        <form action="/listaProduto" method="GET">
            <button type="submit">Ir para lista de produto</button>
        </form>
        <form action="/carrinho" method="GET">
            <button type="submit">Ver carrinho</button>
        </form>
        <form action="/logout" method="GET">
            <button type="submit">Sair da conta</button>
        </form>
    </div>

    <footer>
        <img th:src="@{/images/LogoNome.png}" alt="logo" width="300px">
        <p class="desc">Siga-nos nas redes sociais</p>
        <p class="ar">@petLife_company</p>
    </footer>
</body>

</html>
