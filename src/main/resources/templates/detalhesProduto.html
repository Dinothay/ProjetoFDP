<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Detalhes do Produto</h1>
    <div class="produto">
        <img th:src="@{'/' + ${produto.image}}" alt="Imagem">
        <h3>[[${produto.nome}]]</h3>
        <p class="preco">R$ [[${produto.preco}]]</p>

    </div>
    <form th:action="@{/produto/{id}(id=${produto.id})}" th:method="GET">
        <button type="submit">Comprar</button>
    </form>
    <form th:action="@{/adicionar}" method="POST">
        <input type="hidden" name="id" th:value="${produto.id}">
        <button type="submit">Adicionar ao carrinho</button>
    </form>
    <h3><a href="/listaProduto">Ir para lista de produto</a></h3>
    <h3><a href="/carrinho">Ver carrinho</a></h3>
</body>

</html>
