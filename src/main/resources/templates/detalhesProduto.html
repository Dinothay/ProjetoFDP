<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Detalhes do Produto</h1>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>[[${produto.nome}]]</td>
            <td>[[${produto.descricao}]]</td>
            <td>R$[[${produto.preco}]]</td>
        </tr>
    </table>
    <form th:action="@{/adicionar}" method="POST">
        <input type="hidden" name="id" th:value="${produto.id}">
        <button type="submit">Adicionar ao carrinho</button>
    </form>
    <h3><a href="/listaProduto">Ir para lista de produto</a></h3>
    <h3><a href="/carrinho">Ver carrinho</a></h3>
</body>

</html>
