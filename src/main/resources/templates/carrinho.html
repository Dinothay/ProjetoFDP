<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Carrinho</title>
</head>

<body>
    <h1>Seu carrinho</h1>
    <div class="item" th:each="item : ${carrinho.itens}">

        <img th:src="@{'/' + ${item.produto.image}}" alt="Imagem">

        <h3>[[${item.produto.nome}]]</h3>

        <p>Preço: R$ [[${item.produto.preco}]]</p>
        <form th:action="@{/mais}" method="POST">
            <input type="hidden" name="id" th:value="${item.produto.id}">
            <button type="submit">+</button>
        </form>
        <p>Quantidade: [[${item.quantidade}]]</p>
        <form th:action="@{/menos}" method="POST">
            <input type="hidden" name="id" th:value="${item.produto.id}">
            <button type="submit">-</button>
        </form>
        <p>Total: R$ [[${item.total}]]</p>
        <form th:action="@{/remover}" method="POST">
            <input type="hidden" name="id" th:value="${item.produto.id}">
            <button type="submit">retirar</button>
        </form>
    </div>
    <br>
    <table border="1" th:if="${carrinho.itens.size() > 0}">
        <tr>
            <th>Total</th>
        </tr>
        <tr>
            <td>[[${total}]]</td>
        </tr>
    </table>
    <h3 th:if="${carrinho.itens.size() == 0}">O carrinho está vazio</h3>
    <br>
    <form th:action="@{/limpar}" method="POST">
        <button type="submit">Limpar Carrinho</button>
    </form>
    <br>
    <a href="/listaProduto">Voltar</a>
    <form action="/logout" method="GET">
        <button type="submit">Sair da conta</button>
    </form>
</body>

</html>
