<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carrinho</title>
</head>
<body>
    <h1>Seu carrinho</h1>
    <table border="1" th:if="${carrinho.itens.size() > 0}">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Total</th>
            <th>Remover</th>
        </tr>
        <tr th:each="item : ${carrinho.itens}">
            <td>[[${item.produto.id}]]</td>
            <td>[[${item.produto.nome}]]</td>
            <td>[[${item.produto.preco}]]</td>
            <td><form th:action="@{/mais}" method="POST">
                    <input type="hidden"name="id"th:value="${item.produto.id}">
                    <button type="submit">+</button>
                </form>
                [[${item.quantidade}]]
                <form th:action="@{/menos}" method="POST">
                    <input type="hidden"name="id"th:value="${item.produto.id}">
                    <button type="submit">-</button>
                </form>
            </td>
            <td>[[${item.total}]]</td>
            <td><form th:action="@{/remover}" method="POST">
                    <input type="hidden"name="id"th:value="${item.produto.id}">
                    <button type="submit">Remover</button>
                </form>
            </td>
        </tr>
    </table>
    <br>
    <table border="1"
           th:if="${carrinho.itens.size() > 0}">
        <tr>
            <th>Total</th>
        </tr>
        <tr>
            <td>[[${total}]]</td>
        </tr>
    </table>
    <h3 th:if="${carrinho.itens.size() == 0}">O carrinho está vazio</h3>
    <br>
    <form th:action="@{/limpar}" method="POST">
        <button type="submit">Limpar Carrinho</button>
    </form>
    <br>
    <a href="/listaProduto">Voltar</a>
</body>
</html>
